<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff8e7"><title>Hora do Código · Fábrica do Pai Natal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1e1b4b;--sun:#ffd23f;--coral:#ff6b6b;--mint:#2ee6a6;--sky:#4cc9f0;--grape:#7c3aed;--cream:#fff8e7;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background-color:var(--cream);background-image:radial-gradient(rgba(255,150,60,.30) 1.4px,transparent 1.6px);background-size:22px 22px;color:var(--ink);font-family:'Nunito','Nunito Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding:10px 10px 170px;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.w{max-width:920px;margin:0 auto}
header{background:#fff;border:3px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink);padding:10px 16px;margin-bottom:16px}
h1{font-family:'Fredoka','Nunito',sans-serif;font-size:1.45rem;margin:0;color:var(--ink);font-weight:700}
.sub{font-weight:800;opacity:.65;font-size:.9rem}
.card{background:#fff;border:3px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink);padding:12px;margin-bottom:16px}
canvas#cv{width:100%;aspect-ratio:16/9;display:block;border-radius:14px;background:#1b1f33;border:2.5px solid var(--ink)}
button{font:800 .95rem 'Nunito',system-ui,sans-serif;cursor:pointer;border:2.5px solid var(--ink);border-radius:14px;box-shadow:0 3px 0 var(--ink);padding:8px 12px;color:var(--ink);background:#fff;transition:transform .08s,box-shadow .08s}
button:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
button[style*="background"],#go,#clr,#pyb{color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.3)}
#go{background:#16a34a}#clr{background:#6b7280}#pyb{background:#3776ab}
.lv{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.lvb.on{background:var(--sun)}
#mis{font-weight:800;margin:6px 0}
.pal{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
#prog{min-height:64px;display:flex;flex-direction:column;gap:4px;border:2.5px dashed #b9ad8a;border-radius:14px;padding:8px;background:#fffdf5}
.chip{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;padding:6px 10px;border-radius:10px;border:2px solid var(--ink);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.3);font-weight:800;cursor:pointer}
.chip b{background:rgba(0,0,0,.28);border-radius:6px;padding:0 6px}
.chip.run{outline:3px solid var(--sun);outline-offset:2px}
.chip.sel{outline:3px dashed var(--ink);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
#msg{margin-top:8px;font-weight:800;min-height:1.4em}
#pyw{display:none}
#py{width:100%;margin-top:8px;padding:10px;border-radius:12px;background:#0f1424;color:#9be28f;font-family:ui-monospace,Consolas,monospace;border:2.5px solid var(--ink);resize:vertical}
label{font-size:.9rem;font-weight:700}
#nm{font:inherit;padding:6px 8px;border:2.5px solid var(--ink);border-radius:10px;width:150px}
select{font:inherit;border:2.5px solid var(--ink);border-radius:10px;padding:4px}
footer{text-align:center;font-size:.85rem;font-weight:800;opacity:.75;margin-top:6px}
#fixed-robot-wrap{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));right:14px;z-index:30;display:flex;flex-direction:column;align-items:center;pointer-events:none}
#fixed-robot-wrap .fixed-bubble{pointer-events:auto;position:relative;z-index:2;margin-bottom:12px;max-width:190px;min-width:120px;text-align:center;background:linear-gradient(135deg,#eef2ff,#fff);border:2.5px solid #4f46e5;border-radius:16px;padding:8px 12px;box-shadow:3px 3px 0 rgba(30,27,75,.85);font-family:'Nunito',sans-serif;font-weight:800;font-size:.85rem;color:#1e1b4b;opacity:0;transform:translateY(6px) scale(.9);transition:opacity .35s,transform .35s cubic-bezier(.34,1.56,.64,1)}
#fixed-robot-wrap .fixed-bubble.show{opacity:1;transform:none}
#fixed-robot-wrap .fixed-bubble::after{content:"";position:absolute;bottom:-13px;right:34px;border-left:9px solid transparent;border-right:9px solid transparent;border-top:13px solid #4f46e5}
#fixed-robot-wrap .fixed-bubble::before{content:"";position:absolute;bottom:-9px;right:36px;border-left:7px solid transparent;border-right:7px solid transparent;border-top:10px solid #eef2ff;z-index:1}
#fixed-robot-wrap .fixed-robot{pointer-events:auto;cursor:pointer;width:130px;height:130px;display:block;position:relative;z-index:1;animation:fixedVbFloat 3.2s ease-in-out infinite;filter:drop-shadow(0 0 14px #7dd3fc)}
#fixed-robot-wrap .fixed-robot.bounce{animation:fixedVbJump .7s ease}
@keyframes fixedVbFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes fixedVbJump{0%{transform:translateY(0)}35%{transform:translateY(-26px) scale(1.05)}70%{transform:translateY(0) scale(.97)}100%{transform:translateY(0)}}
@media(max-width:480px){#fixed-robot-wrap .fixed-robot{width:84px;height:84px}#fixed-robot-wrap{bottom:8px;right:8px}#fixed-robot-wrap .fixed-bubble{max-width:150px;font-size:.78rem}}
.stage{position:relative}#hud{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:8px;pointer-events:none}#hud div{background:rgba(18,20,30,.78);color:#fff;border-radius:12px;padding:6px 10px;display:flex;flex-direction:column;min-width:96px}#hud b{font:700 1.1rem 'Fredoka',sans-serif}#hud span{font-size:.7rem;opacity:.75}#stl{position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:6px;pointer-events:none}#stl .s{flex:1;background:rgba(18,20,30,.72);color:#cbd5e1;border-radius:10px;padding:4px 8px;font-weight:800;font-size:.78rem;border:2px solid transparent}#stl .s i{font-style:normal;opacity:.6;margin-right:2px}#stl .s small{display:block;font-weight:700;opacity:.7}#stl .s.on{border-color:#ffd23f;color:#fff}#stl .s.ok{color:#2ee6a6}@media(max-width:560px){#hud div{min-width:0;padding:4px 6px}#hud b{font-size:.85rem}#hud span{font-size:.6rem}#stl .s{font-size:.62rem;padding:3px 5px}#stl .s small{display:none}}
</style>
</head>
<body>
<div class="w">
<header><h1>🎅 Hora do Código · Fábrica do Pai Natal</h1><div class="sub">VanBerto’s · Programa com blocos e Python</div></header>
<div class="card">
<div class="stage"><canvas id="cv" width="640" height="360"></canvas><div id="hud"><div><b id="h-done">0</b><span>prendas no trenó</span></div><div><b id="h-t">0.0 s</b><span>tempo desta prenda</span></div><div><b id="h-st">Oficina à espera</b><span>agora</span></div></div><div id="stl"><div class="s"><i>1</i> Oficina<small>à espera</small></div><div class="s"><i>2</i> Embrulho<small>à espera</small></div><div class="s"><i>3</i> Laços<small>à espera</small></div><div class="s"><i>4</i> Cartões<small>à espera</small></div></div></div>
<div class="row"><label>👤 <input id="nm" type="text" placeholder="O teu nome"></label><label>⏱ <select id="sp"><option value="0.6">Devagar</option><option value="1" selected>Normal</option><option value="2">Rápido</option></select></label><label><input type="checkbox" id="stp"> 🐢 Passo a passo</label><label><input type="checkbox" id="snd" checked> 🔊</label><label><input type="checkbox" id="lt"> ⚡ Modo leve</label></div>
</div>
<div class="card">
<div class="lv" id="cys"></div>
<div class="lv" id="lvs"></div>
<div id="mis"></div>
<div class="pal">
<button style="background:#b45309" data-a="S">🔨 fazer brinquedo</button>
<button style="background:#e5484d" data-a="R">🎁 papel vermelho</button>
<button style="background:#3e63dd" data-a="B">🎁 papel azul</button>
<button style="background:#4c9a2a" data-a="G">🎁 papel verde</button>
<button style="background:#d4a000" data-a="Y">🎁 papel amarelo</button>
<button style="background:#d946a8" data-a="M">🎀 pôr laço</button>
<button style="background:#0e7490" data-a="W">✉️ pôr cartão</button>
<button style="background:#30a46c" data-a="E">🛷 pôr no trenó</button>
<button style="background:#8e4ec6" data-a="rep">🔁 repetir</button>
<button style="background:#a98bd8" data-a="end">fim do repetir</button>
<button style="background:#2b8a9e" data-a="ifB">🔀 se pedido azul</button>
<button style="background:#2b8a9e" data-a="ifR">🔀 se pedido vermelho</button>
<button style="background:#4aa8bb" data-a="else">↔ senão</button>
<button style="background:#9333ea" data-a="X">🔁 refazer embrulho</button>
<button style="background:#2b8a9e" data-a="ifD">🔀 se embrulho rasgado</button>
<button style="background:#c2410c" data-a="wh">🔄 enquanto faltar fazer</button>
</div>
<div id="prog"></div>
<div class="row">
<button id="go">▶ Executar</button>
<button id="clr">🗑 Limpar</button>
<button id="pyb">🐍 Ver em Python</button>
</div>
<div id="msg"></div>
<div id="pyw"><textarea id="py" rows="6" spellcheck="false"></textarea><div class="row"><button id="pya" style="background:#3776ab">⬆ Usar este código</button></div></div>
</div>
<footer>© Prof.ª Vanda Várzea</footer>
</div>

<div id="fixed-robot-wrap"><div class="fixed-bubble" id="fixedRobotBubble" role="status" aria-live="polite">Olá! 😊</div><canvas class="fixed-robot" id="fixed-robot-cv" width="192" height="192" role="button" tabindex="0" aria-label="Robô VanBerto's — clica para falar"></canvas></div>

<div id="cert" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;padding:12px;overflow:auto"><div class="card" style="max-width:700px;margin:0 auto"><img id="cimg" alt="Certificado" style="width:100%"><div class="row"><button id="cdl" style="background:#30a46c">⬇ Guardar PNG</button><button id="cpr" style="background:#3776ab">🖨️ Imprimir</button><button id="cx" style="background:#6b7280">Fechar</button></div></div></div>

<script>
const $=s=>document.querySelector(s);
const NAME={S:'🔨 fazer brinquedo',R:'🎁 papel vermelho',B:'🎁 papel azul',G:'🎁 papel verde',Y:'🎁 papel amarelo',M:'🎀 pôr laço',W:'✉️ pôr cartão',E:'🛷 pôr no trenó',X:'🔁 refazer embrulho',ifB:'🔀 se pedido azul',ifR:'🔀 se pedido vermelho',ifD:'🔀 se embrulho rasgado',else:'↔ senão',wh:'🔄 enquanto faltar fazer',rep:'🔁 repetir',end:'fim'};
const COL={S:'#b45309',R:'#e5484d',B:'#3e63dd',G:'#4c9a2a',Y:'#d4a000',M:'#d946a8',W:'#0e7490',E:'#30a46c',X:'#9333ea',ifB:'#2b8a9e',ifR:'#2b8a9e',ifD:'#2b8a9e',else:'#4aa8bb',wh:'#c2410c',rep:'#8e4ec6',end:'#a98bd8'};
const PY={S:'fazer_brinquedo()',R:'embrulhar("vermelho")',B:'embrulhar("azul")',G:'embrulhar("verde")',Y:'embrulhar("amarelo")',M:'por_laco()',W:'por_cartao()',E:'por_no_treno()',X:'refazer_embrulho()',ifB:'if pedido == "azul":',ifR:'if pedido == "vermelho":',ifD:'if embrulho_rasgado():',wh:'while faltam_brinquedos():'};
const x=(n,k)=>Array(n).fill(k);
const B1=['S','R','B','G','Y','M','W','E'],B2=[...B1,'rep'],B4=[...B2,'ifB','ifR','else','wh','ifD','X'];
const CY=[
{n:'1.º Ciclo',b:B1,py:0,lv:[
 {t:'Faz um brinquedo e põe-no no trenó.',g:['S','E']},
 {t:'Faz um brinquedo, embrulha-o em papel vermelho e põe-no no trenó.',g:['S','R','E']},
 {t:'Faz um brinquedo, embrulha em papel verde, põe o laço e coloca no trenó.',g:['S','G','M','E']},
 {t:'Faz um brinquedo, embrulha na cor que quiseres, põe laço e cartão e coloca no trenó.',g:['S','P','M','W','E'],free:true},
 {t:'Faz um brinquedo, embrulha em vermelho, põe o laço e coloca no trenó.',g:['S','R','M','E']},
 {t:'Prenda azul completa: faz o brinquedo, embrulha em azul, põe o laço e o cartão e coloca no trenó.',g:['S','B','M','W','E']},
 {t:'Faz um brinquedo, embrulha em amarelo, põe o cartão e coloca no trenó.',g:['S','Y','W','E']},
 {t:'Faz um brinquedo, põe o laço e o cartão (sem embrulho!) e coloca no trenó.',g:['S','M','W','E']}]},
{n:'2.º Ciclo',b:B2,py:0,lv:[
 {t:'Faz 3 brinquedos, embrulha em vermelho e põe no trenó. Dica: usa o repetir!',g:[...x(3,'S'),'R','E']},
 {t:'Faz 4 brinquedos, embrulha em azul, põe o laço e coloca no trenó.',g:[...x(4,'S'),'B','M','E']},
 {t:'Faz 2 brinquedos, embrulha em vermelho, faz mais 2, põe o laço e coloca no trenó.',g:['S','S','R','S','S','M','E']},
 {t:'Faz 5 brinquedos, embrulha em verde, põe o cartão e coloca no trenó.',g:[...x(5,'S'),'G','W','E']},
 {t:'🐞 Encontra o erro! Era para fazer 3 brinquedos, embrulhar em vermelho e pôr no trenó, mas o programa tem um erro. Corrige-o!',pre:[{k:'rep',n:3},{k:'S'},{k:'end'},{k:'G'},{k:'E'}],g:[...x(3,'S'),'R','E']},
 {t:'Prenda amarela: faz 2 brinquedos, embrulha em amarelo, põe o laço e coloca no trenó.',g:['S','S','Y','M','E']},
 {t:'Faz 2 brinquedos, embrulha em verde, põe o laço e o cartão e coloca no trenó.',g:['S','S','G','M','W','E']},
 {t:'Faz 4 brinquedos, embrulha em vermelho, põe o laço e o cartão e coloca no trenó.',g:[...x(4,'S'),'R','M','W','E']},
 {t:'🐞 Encontra o erro! Era para embrulhar em azul e pôr o laço, mas o programa embrulha na cor errada. Corrige-o!',pre:[{k:'S'},{k:'R'},{k:'M'},{k:'E'}],g:['S','B','M','E']}]},
{n:'3.º Ciclo',b:B2,py:1,lv:[
 {t:'Repete 3 vezes: fazer um brinquedo e embrulhar em vermelho. Depois põe o laço e coloca no trenó.',g:['S','R','S','R','S','R','M','E']},
 {t:'Faz 3 brinquedos, embrulha em verde, põe o laço e o cartão e coloca no trenó.',g:[...x(3,'S'),'G','M','W','E']},
 {t:'Repete 2 vezes: fazer 2 brinquedos e embrulhar em azul. Depois laço e trenó.',g:['S','S','B','S','S','B','M','E']},
 {t:'Repete 3 vezes: fazer um brinquedo e embrulhar em verde. Depois laço, cartão e trenó.',g:['S','G','S','G','S','G','M','W','E']},
 {t:'Repete 4 vezes: fazer um brinquedo e embrulhar em azul. Depois laço e trenó.',g:['S','B','S','B','S','B','S','B','M','E']},
 {t:'Repete 2 vezes: fazer 3 brinquedos e embrulhar em vermelho. Depois cartão e trenó.',g:['S','S','S','R','S','S','S','R','W','E']},
 {t:'Faz 5 brinquedos, embrulha em amarelo, põe o laço e o cartão e coloca no trenó.',g:[...x(5,'S'),'Y','M','W','E']}]},
{n:'Secundário',b:B4,py:2,lv:[
 {t:'Cada pedido chega com um número diferente de brinquedos por fazer. Usa «enquanto» para os fazer todos, embrulha em vermelho, põe o laço e coloca no trenó.',max:5,tests:[{pecas:2},{pecas:3},{pecas:5}],x:e=>[...x(e.pecas,'S'),'R','M','E']},
 {t:'O pedido pode ser azul ou vermelho. Faz 1 brinquedo, embrulha na cor do pedido (usa «se» e «senão»), põe laço e cartão e coloca no trenó.',max:9,tests:[{cor:'B'},{cor:'R'}],x:e=>['S',e.cor,'M','W','E']},
 {t:'Pedido completo! Faz todos os brinquedos que faltam, embrulha na cor do pedido, põe o laço e coloca no trenó.',max:9,tests:[{pecas:1,cor:'B'},{pecas:3,cor:'R'},{pecas:4,cor:'B'}],x:e=>[...x(e.pecas,'S'),e.cor,'M','E']},
 {t:'🔍 Controlo de qualidade! Faz o brinquedo, embrulha em vermelho e, SE o embrulho estiver rasgado, refaz o embrulho. Depois põe no trenó.',max:6,tests:[{defeito:true},{defeito:false}],x:e=>['S','R',...(e.defeito?['X']:[]),'E']},
 {t:'O pedido pode ser azul ou vermelho e chega com brinquedos por fazer. Faz todos, embrulha na cor do pedido, põe o laço e o cartão e coloca no trenó.',max:10,tests:[{pecas:2,cor:'R'},{pecas:3,cor:'B'},{pecas:5,cor:'R'}],x:e=>[...x(e.pecas,'S'),e.cor,'M','W','E']},
 {t:'🔍 Controlo de qualidade com vários brinquedos! Faz todos, embrulha em vermelho, SE o embrulho estiver rasgado refaz, põe o laço e coloca no trenó.',max:8,tests:[{pecas:2,defeito:true},{pecas:4,defeito:false},{pecas:3,defeito:true}],x:e=>[...x(e.pecas,'S'),'R',...(e.defeito?['X']:[]),'M','E']},

function toPy(){

  if(b.k==='end'){if(prevOpen)o.push('    '.repeat(ind)+'pass');ind=Math.max(0,ind-1);prevOpen=false;continue}
  const sp='    '.repeat(ind);
  if(b.k==='rep'){o.push(sp+'for i in range('+b.n+'):');ind++;prevOpen=true;continue}
  if(OPEN.includes(b.k)){o.push(sp+PY[b.k]);ind++;prevOpen=true;continue}

function parsePy(t){
 const out=[];let depth=0;
 const ok=(b,l)=>{if(!CY[cy].b.includes(b.k))throw new Error('Neste ciclo ainda não podes usar: '+l);out.push(b)};
 for(const raw of t.split('\n')){
  const l=raw.trim();if(!l||l[0]==='#')continue;
  const ind=Math.floor((raw.length-raw.trimStart().length)/4);
  if(l==='else:'){
   while(depth>ind+1){out.push({k:'end'});depth--}
   if(depth<1||ind!==depth-1)throw new Error('O «else:» tem de ficar ao nível do «if»');
   ok({k:'else'},l);continue;
  }
  while(depth>ind){out.push({k:'end'});depth--}
  if(l==='pass')continue;
  if(ind>depth)throw new Error('Indentação errada (usa 4 espaços dentro do bloco): '+l);
  let m;
  if(m=l.match(/^for\s+\w+\s+in\s+range\((\d+)\):$/)){const n=+m[1];if(n<1||n>5)throw new Error('range deve ir de 1 a 5');ok({k:'rep',n},l);depth++}
  else if(l==='while faltam_brinquedos():'){ok({k:'wh'},l);depth++}
  else if(/^if pedido == ["']azul["']:$/.test(l)){ok({k:'ifB'},l);depth++}
  else if(/^if pedido == ["']vermelho["']:$/.test(l)){ok({k:'ifR'},l);depth++}
  else if(l==='if embrulho_rasgado():'){ok({k:'ifD'},l);depth++}
  else if(l==='refazer_embrulho()')ok({k:'X'},l);
  else if(l==='fazer_brinquedo()')ok({k:'S'},l);
  else if((l==='por_no_treno()'||l==='por_no_trenó()'))ok({k:'E'},l);
  else if(l==='por_laco()')ok({k:'M'},l);
  else if(l==='por_cartao()')ok({k:'W'},l);
  else if(m=l.match(/^embrulhar\(["'](vermelho|azul|verde|amarelo)["']\)$/))ok({k:{vermelho:'R',azul:'B',verde:'G',amarelo:'Y'}[m[1]]},l);

}

const OPT=[[2,3,4,5,4,5,4,4],[4,5,7,5,4,5,6,6,4],[5,6,6,6,5,6,6],[5,8,8,5,9,7,7]];

}

const CERT_AC={game:'Fábrica do Pai Natal',main:'#c0262d',dark:'#7f1d1d',rgb:'192,38,45'};
function certStar(g,cx,cy,R,r){g.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rad=i%2?r:R;g[i?'lineTo':'moveTo'](cx+Math.cos(a)*rad,cy+Math.sin(a)*rad)}g.closePath()}
function certificate(){
 const draw=()=>{
  const W=1600,H=1131,F="'Nunito', sans-serif",c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d'),AC=CERT_AC;
  const st=LV.reduce((a,_,i)=>a+(P.d[cy+'-'+i]||0),0),max=LV.length*3,pct=max?st/max:1,earned=Math.max(1,Math.round(pct*3));
  const fit=(t,mw,px,w,mn)=>{let z=px;for(;;){g.font=w+' '+z+'px '+F;if(g.measureText(t).width<=mw||z<=(mn||18))break;z-=2}};
  const bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#fffdf6');bg.addColorStop(1,'#fff6df');g.fillStyle=bg;g.fillRect(0,0,W,H);
  g.strokeStyle='#d9a441';g.lineWidth=12;g.strokeRect(40,40,W-80,H-80);
  g.strokeStyle=AC.dark;g.lineWidth=3;g.strokeRect(70,70,W-140,H-140);
  g.strokeStyle='rgba('+AC.rgb+',0.35)';g.lineWidth=2;g.strokeRect(82,82,W-164,H-164);
  [[70,70],[W-70,70],[70,H-70],[W-70,H-70]].forEach(([x,y])=>{g.save();g.translate(x,y);g.rotate(Math.PI/4);g.fillStyle='#d9a441';g.fillRect(-15,-15,30,30);g.strokeStyle=AC.dark;g.lineWidth=3;g.strokeRect(-15,-15,30,30);g.restore()});
  g.textAlign='center';const lx=270;
  try{const rb=document.createElement('canvas');rb.width=480;rb.height=480;const rg=rb.getContext('2d');rg.scale(5,5);drawVanBerto(rg,'happy',-1,true);g.drawImage(rb,lx-240,235,480,480)}catch(e){g.font='190px sans-serif';g.fillStyle='#000';g.fillText('🤖',lx,520)}
  for(let i=0;i<3;i++){const sx=lx+(i-1)*92,sy=770;certStar(g,sx,sy,40,17);g.fillStyle=i<earned?'#f5b301':'#eadfc4';g.fill();g.lineWidth=4;g.strokeStyle=i<earned?'#b07d00':'#d6c79c';g.stroke()}
  g.fillStyle=AC.dark;g.font='900 46px '+F;g.fillText("VanBerto's",lx,885);
  const cx=1000,mw=1000,name=P.name||'Aluno(a)';
  g.fillStyle=AC.dark;fit('CERTIFICADO OFICIAL',mw,60,'900');g.fillText('CERTIFICADO OFICIAL',cx,185);
  g.fillStyle=AC.main;const sub=(AC.game+' · '+CY[cy].n).toUpperCase();fit(sub,mw,28,'800');g.fillText(sub,cx,232);
  g.strokeStyle='#d9a441';g.lineWidth=3;g.beginPath();g.moveTo(cx-260,262);g.lineTo(cx+260,262);g.stroke();
  g.fillStyle='#d9a441';g.beginPath();g.arc(cx,262,7,0,Math.PI*2);g.fill();
  g.fillStyle='#555';g.font='600 32px '+F;g.fillText('Este certificado é atribuído a',cx,325);
  g.fillStyle=AC.dark;fit(name,mw,100,'900',40);g.fillText(name,cx,430);
  g.fillStyle='#444';fit('por ter concluído todas as missões do',mw,34,'600');g.fillText('por ter concluído todas as missões do',cx,502);
  g.fillStyle=AC.main;fit(CY[cy].n,mw,54,'900',28);g.fillText(CY[cy].n,cx,574);
  const fin='Programou com blocos'+(CY[cy].py?' e Python':'')+', com o VanBerto’s!';
  g.fillStyle='#444';fit(fin,mw,32,'600');g.fillText(fin,cx,634);
  const bw=300,bh=170,gap=30,x0=cx-(3*bw+2*gap)/2,y0=690;
  const box_=x=>{g.fillStyle='rgba('+AC.rgb+',0.09)';g.strokeStyle=AC.main;g.lineWidth=3;g.beginPath();if(g.roundRect)g.roundRect(x,y0,bw,bh,20);else g.rect(x,y0,bw,bh);g.fill();g.stroke()};
  [[LV.length+' / '+LV.length,'missões'],[st+' / '+max,'estrelas']].forEach((s,i)=>{const x=x0+i*(bw+gap);box_(x);g.fillStyle=AC.dark;fit(s[0],bw-40,68,'900',30);g.fillText(s[0],x+bw/2,y0+90);g.fillStyle='#777';g.font='800 26px '+F;g.fillText(s[1].toUpperCase(),x+bw/2,y0+140)});
  const mx=x0+2*(bw+gap);box_(mx);
  const pc=pct*100,mw_=pc>=100?'Perfeito':pc>=80?'Excelente':pc>=60?'Bom':'Concluído',mcol=pc>=100?['#f7c948','#b07d00']:pc>=80?['#d5dde6','#7c8a99']:pc>=60?['#e0a070','#8a5226']:['#86efac','#15803d'];
  const mcx=mx+bw/2,mcy=y0+52;
  g.fillStyle=mcol[0];g.strokeStyle=mcol[1];g.lineWidth=6;g.beginPath();g.arc(mcx,mcy,34,0,Math.PI*2);g.fill();g.stroke();
  certStar(g,mcx,mcy+1,19,8);g.fillStyle=mcol[1];g.fill();
  g.fillStyle=AC.dark;fit(mw_,bw-40,40,'900',22);g.fillText(mw_,mcx,y0+120);
  g.fillStyle='#777';g.font='800 22px '+F;g.fillText('MEDALHA',mcx,y0+152);
  g.fillStyle='#777';g.font='italic 700 30px '+F;g.fillText(new Date().toLocaleDateString('pt-PT',{day:'numeric',month:'long',year:'numeric'}),cx,922);
  g.strokeStyle=AC.dark;g.lineWidth=3;g.beginPath();g.moveTo(cx-200,972);g.lineTo(cx+200,972);g.stroke();
  g.fillStyle=AC.dark;g.font='italic 800 38px '+F;g.fillText('Prof.ª Vanda Várzea',cx,1018);
  $('#cimg').src=c.toDataURL('image/png');$('#cert').style.display='block';
 };
 if(document.fonts&&document.fonts.ready)document.fonts.ready.then(draw);else draw();
}

$('#go').onclick=async()=>{
 if(running)return;
 const L=LV[lv],tests=L.tests||[null],e0=tests[Math.floor(Math.random()*tests.length)];
 const acts=expand(e0?{...e0}:null);
 if(!acts.length){say('Junta primeiro alguns blocos! 🙂');return}
 if(acts.length>40){say('Programa muito grande! Usa o repetir com menos vezes.','sad');return}
 running=true;$('#msg').textContent='';reset();tStart();showEnv(e0?{...e0}:null);
 const lab=e0&&e0.defeito!==undefined?(e0.defeito?'🔍 Embrulho rasgado! · ':'🔍 Embrulho perfeito · '):e0?(e0.cor?'📋 Pedido '+(e0.cor==='B'?'azul':'vermelha')+' · ':'🧸 Brinquedos por fazer: '+e0.pecas+' · '):'';
 const off=()=>document.querySelectorAll('.chip.run').forEach(c=>c.classList.remove('run'));
 for(let i=0;i<acts.length;i++){
  off();const c=document.querySelector('.chip[data-i="'+acts[i].i+'"]');if(c)c.classList.add('run');if(document.getElementById('stp')&&document.getElementById('stp').checked)await VB.step();
  $('#msg').textContent=lab+'Passo '+(i+1)+' de '+acts.length;await ACT[acts[i].k]();
 }
 off();running=false;tStop();
 const cnt=prog.filter(b=>b.k!=='end').length,nz=a=>L.free?a.map(k=>'RBGY'.includes(k)?'P':k):a,seq=e=>nz(expand(e?{...e}:null).map(a=>a.k)).join(),goal=e=>nz(L.x?L.x(e):L.g).join(),shownOk=seq(e0)===goal(e0),okSeq=tests.every(e=>seq(e)===goal(e)),ok=okSeq&&(!L.max||cnt<=L.max);
 if(ok){
  const o=OPT[cy][lv],st=cnt<=o?3:cnt<=o+2?2:1,key=cy+'-'+lv;
  if((P.d[key]||0)<st)P.d[key]=st;FAILS[key]=0;save();levels();
  const all=LV.every((_,i)=>P.d[cy+'-'+i]);
  $('#msg').innerHTML='✅ Missão cumprida! '+'⭐'.repeat(st)+(st<3?' (com menos blocos ganhas mais estrelas)':'')+(lv<LV.length-1?' <button id="nx" style="background:#2f6bff">Próxima missão ▶</button>':' Terminaste as missões deste ciclo! 🏆')+(all?' <button id="ce" style="background:#e5a000">🎓 Certificado</button>':'');
  say('Boa! A fábrica está orgulhosa de ti! 🎉');dance();
  beep(523,.12);beep(659,.12,'square',.12);beep(784,.25,'square',.24);
  const n=$('#nx');if(n)n.onclick=()=>{lv++;clear();levels();render();reset();$('#msg').textContent='';say(LV[lv].t)};
  const ce=$('#ce');if(ce)ce.onclick=certificate;
 }else{

  $('#msg').textContent=okSeq?'❌ O resultado está certo, mas usaste blocos a mais. Tenta com menos!':(shownOk?'❌ Funciona neste pedido, mas não em todos! O programa tem de servir para qualquer pedido.':VB.hint(FAILS[fk],nz(expand(e0?{...e0}:null).map(a=>a.k)),nz(L.x?L.x(e0):L.g),k=>k==='P'?'🎁 embrulhar (uma cor)':NAME[k]));
  say('Quase! Confere a ordem e quantas vezes soldas.','sad');beep(200,.3,'sawtooth');
 }
};
