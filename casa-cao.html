<script>
const $=s=>document.querySelector(s);

const PY={F:'andar()',L:'virar_esquerda()',R:'virar_direita()',luz:'luz()',porta:'abrir_porta()',wh:'while caminho_livre():',ifO:'if luz_apagada():'};
/*LOGIC*/
const OPEN=['rep','wh','ifO'];
const W=6,H=5,TS=1.6,DX=[1,0,-1,0],DY=[0,1,0,-1],key=(x,y)=>x+','+y;
const s=(x,y,d)=>({x,y,d});
const CY=[
{n:'1.º Ciclo',b:['F','L','R','luz'],py:0,lv:[
 {t:'Leva o cão até à tigela 🦴.',start:s(0,2,0),target:[3,2]},
 {t:'Leva o cão até à tigela. Atenção às curvas!',start:s(0,0,0),target:[2,2]},

 {t:'🐞 Encontra o erro! Era para levar o cão à tigela, mas o programa tem um erro. Corrige-o!',start:s(0,2,0),target:[3,2],pre:[{k:'F'},{k:'F'},{k:'L'},{k:'F'}]},
 {t:'Há um sofá no caminho! Contorna-o e leva o cão até à tigela.',start:s(0,1,0),walls:[[1,1]],target:[2,1]},
 {t:'Acende os 2 candeeiros e termina na tigela.',start:s(0,0,0),lamps:[[1,0],[3,0]],target:[3,0]}]},
{n:'2.º Ciclo',b:['F','L','R','luz','rep'],py:0,lv:[
 {t:'Leva o cão até à tigela. Dica: usa o repetir!',start:s(0,0,0),target:[5,0]},
 {t:'Acende o candeeiro e continua até à tigela.',start:s(0,2,0),lamps:[[2,2]],target:[5,2]},
 {t:'Faz uma escada: repete andar, virar à direita, andar e virar à esquerda.',start:s(0,0,0),target:[3,3]},
 {t:'Vai até ao canto da sala e depois desce até à tigela. Usa o repetir duas vezes!',start:s(0,0,0),target:[5,3]}]},
{n:'3.º Ciclo',b:['F','L','R','luz','porta','rep'],py:1,lv:[
 {t:'Acende os 2 candeeiros e termina na tigela.',start:s(0,0,0),lamps:[[2,0],[4,0]],target:[4,0]},
 {t:'A porta só abre quando o cão carrega no botão vermelho do chão. Chega à tigela!',start:s(0,2,0),doors:[{x:4,y:2,b:[3,2]}],walls:[[4,0],[4,1],[4,3],[4,4]],target:[5,2]},
 {t:'Acende o candeeiro, abre a porta e chega à tigela.',start:s(0,3,0),lamps:[[1,3]],doors:[{x:4,y:3,b:[3,3]}],walls:[[4,0],[4,1],[4,2],[4,4]],target:[5,3]},
 {t:'Duas portas seguidas! Cada porta tem o seu botão no chão. Chega à tigela.',start:s(0,2,0),doors:[{x:2,y:2,b:[1,2]},{x:4,y:2,b:[3,2]}],walls:[[2,0],[2,1],[2,3],[2,4],[4,0],[4,1],[4,3],[4,4]],target:[5,2]}]},
{n:'Secundário',b:['F','L','R','luz','porta','rep','wh','ifO','else'],py:2,lv:[
 {t:'O cão pode começar em sítios diferentes. Faz com que chegue sempre à tigela, no fim da sala. Usa «enquanto».',start:s(0,2,0),target:[5,2],max:3,tests:[{},{start:s(2,2,0)},{start:s(3,2,0)}]},
 {t:'Acende os 3 candeeiros e termina na tigela.',start:s(0,1,0),lamps:[[1,1],[3,1],[5,1]],target:[5,1],max:6},
 {t:'Alguns candeeiros já estão acesos! O botão 💡 liga e desliga. Garante que ficam todos acesos (usa «se»).',start:s(0,1,0),lamps:[[1,1],[2,1],[3,1]],target:[3,1],max:4,tests:[{on:[[1,1]]},{on:[[2,1]]},{on:[[1,1],[3,1]]},{on:[]}]},
 {t:'Percorre o corredor todo, sem saber que candeeiros estão acesos. Acende só os que estiverem apagados (usa «enquanto» e «se»).',start:s(0,1,0),lamps:[[1,1],[2,1],[3,1],[4,1],[5,1]],target:[5,1],max:4,tests:[{on:[]},{on:[[2,1],[4,1]]},{on:[[1,1],[3,1],[5,1]]},{on:[[1,1],[2,1]]}]}]}
];
const OPT=[[3,5,6,3,7,5],[2,5,5,5],[4,5,7,5],[2,4,4,4]];
let prog=[];
const mk=(L,t)=>({start:t.start||L.start,target:t.target||L.target,lamps:L.lamps||[],walls:t.walls||L.walls||[],doors:L.doors||[],on:t.on||L.on||[]});
const blocked=(E,st,x,y)=>x<0||y<0||x>=W||y>=H||E.walls.some(w=>w[0]===x&&w[1]===y)||E.doors.some((d,i)=>d.x===x&&d.y===y&&!st.open.has(i));
function build(){return VB.build(prog,OPEN)}
function exec(nodes,E,st,out){
 for(const nd of nodes){
  if(st.stop||out.length>60)return;
  const k=nd.t.k,lampHere=E.lamps.some(l=>l[0]===st.x&&l[1]===st.y);
  if(k==='rep'){for(let j=0;j<nd.t.n&&!st.stop;j++)exec(nd.b,E,st,out)}
  else if(k==='wh'){let c=0;while(!st.stop&&c++<20&&!blocked(E,st,st.x+DX[st.d],st.y+DY[st.d]))exec(nd.b,E,st,out)}
  else if(k==='ifO'){exec(lampHere&&!st.lit.has(key(st.x,st.y))?nd.b:(nd.e||[]),E,st,out)}
  else{
   let bump=false;
   if(k==='F'){const nx=st.x+DX[st.d],ny=st.y+DY[st.d];if(blocked(E,st,nx,ny)){bump=true;st.stop=true}else{st.x=nx;st.y=ny}}
   else if(k==='L')st.d=(st.d+3)%4;
   else if(k==='R')st.d=(st.d+1)%4;
   else if(k==='luz'){if(lampHere){const q=key(st.x,st.y);st.lit.has(q)?st.lit.delete(q):st.lit.add(q)}else{st.err='luz';st.stop=true;bump=true}}
   else if(k==='porta'){if(E.doors.some(d=>d.b[0]===st.x&&d.b[1]===st.y))E.doors.forEach((d,i)=>{if(d.b[0]===st.x&&d.b[1]===st.y)st.open.add(i)});else{st.err='porta';st.stop=true;bump=true}}
   out.push({k,i:nd.i,x:st.x,y:st.y,d:st.d,lit:[...st.lit],open:[...st.open],bump});
  }
 }
}
function simulate(E){const st={x:E.start.x,y:E.start.y,d:E.start.d,lit:new Set(E.on.map(l=>key(l[0],l[1]))),open:new Set(),stop:false},out=[];exec(build(),E,st,out);return{st,out}}
const won=(E,st)=>st.x===E.target[0]&&st.y===E.target[1]&&E.lamps.every(l=>st.lit.has(key(l[0],l[1])));
/*ENDLOGIC*/

/* ---------- 3D ---------- */
const cv=$('#cv');
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true});
R.outputEncoding=THREE.sRGBEncoding;R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.0;
R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
const S=new THREE.Scene();S.background=new THREE.Color(0xfff1d0);
const cam=new THREE.PerspectiveCamera(42,16/9,.1,80);cam.position.set(0,10.5,8.5);cam.lookAt(0,0,.3);
S.add(new THREE.HemisphereLight(0xffffff,0xb89a6a,.6));
const dl=new THREE.DirectionalLight(0xfff2dd,.9);dl.position.set(-4,11,6);dl.castShadow=true;dl.shadow.mapSize.set(1024,1024);
Object.assign(dl.shadow.camera,{left:-9,right:9,top:7,bottom:-7,near:1,far:30});dl.shadow.camera.updateProjectionMatrix();S.add(dl);
const M=(c,r,m,e)=>new THREE.MeshStandardMaterial({color:c,roughness:r==null?.7:r,metalness:m==null?.05:m,emissive:e||0});
function box(w,h,d,mat,x,y,z,p){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;(p||S).add(m);return m}
function cyl(r1,r2,h,mat,p){const m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,20),mat);m.castShadow=true;(p||S).add(m);return m}
const px=x=>(x-(W-1)/2)*TS,pz=y=>(y-(H-1)/2)*TS;
/* casa em corte */
box(W*TS+.6,.3,H*TS+.6,M(0x6b4a2b),0,-.25,0);
for(let x=0;x<W;x++)for(let y=0;y<H;y++)box(TS-.04,.12,TS-.04,M((x+y)%2?0xb98852:0xc99a62,.8),px(x),-.04,pz(y));
box(W*TS+.6,2.4,.25,M(0xf2e6cf),0,1.1,-H*TS/2-.2);
box(.25,2.4,H*TS+.6,M(0xefdcc0),-W*TS/2-.2,1.1,0);
box(2.6,1.2,.08,M(0x8fd0ff,.2,.1,0x2a5f8f),-1.8,1.5,-H*TS/2-.06);
box(1.5,1.1,.08,M(0xff8a5c,.6),2.8,1.4,-H*TS/2-.06);
box(2.2,.04,1.4,M(0x7c3aed,.9),0,.03,0);
/* cão robô */
const dog=new THREE.Group();S.add(dog);
const dm=M(0xf1f4ff,.35,.3),db=M(0x16233e,.4,.4),blue=M(0x2a9bf0,.3,.1,0x1366c6);
box(.95,.42,.52,dm,0,.6,0,dog);box(.5,.36,.44,dm,.62,.86,0,dog);box(.3,.16,.3,db,.9,.8,0,dog);
for(const z of[-.13,.13])box(.06,.1,.06,M(0xffffff,.3,0,0xffffff),.8,.96,z,dog);
for(const z of[-.24,.24])box(.12,.26,.08,db,.5,1.1,z,dog);
box(.34,.08,.08,db,-.62,.82,0,dog).rotation.z=.6;
box(.5,.16,.54,blue,0,.84,0,dog);
const ant=cyl(.02,.02,.3,db,dog);ant.position.set(.6,1.2,0);
const bulb=new THREE.Mesh(new THREE.SphereGeometry(.07,12,10),M(0x48b4ff,.2,0,0x1670d8));bulb.position.set(.6,1.38,0);dog.add(bulb);
const legs=[];
[[.32,-.2],[.32,.2],[-.32,-.2],[-.32,.2]].forEach(([x,z])=>{const g=new THREE.Group();g.position.set(x,.4,z);dog.add(g);box(.14,.4,.14,db,0,-.2,0,g);legs.push(g)});
dog.scale.setScalar(1.3);
let ang=0,SPD=1;
/* objetos de cada missão */
const LVG=new THREE.Group();S.add(LVG);const lampObjs=[],doorObjs=[];
function label(txt,col){const c=document.createElement('canvas');c.width=256;c.height=96;const g=c.getContext('2d');g.fillStyle='rgba(30,27,75,.92)';g.beginPath();if(g.roundRect)g.roundRect(4,8,248,80,24);else g.rect(4,8,248,80);g.fill();g.strokeStyle=col;g.lineWidth=6;g.stroke();g.fillStyle='#fff';g.font='bold 46px system-ui,sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(txt,128,50);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthTest:false}));sp.scale.set(1.5,.56,1);sp.renderOrder=10;return sp}
function setLamp(i,on){const o=lampObjs[i];if(!o)return;o.shade.material.emissive.set(on?0xffd34d:0);o.glow.material.opacity=on?.55:0}
function show(E){
 while(LVG.children.length)LVG.remove(LVG.children[0]);lampObjs.length=doorObjs.length=0;
 E.walls.forEach(w=>{box(TS*.8,.6,TS*.8,M(0x6b3f22,.8),px(w[0]),.3,pz(w[1]),LVG);box(TS*.8,.25,TS*.3,M(0xd0584a,.8),px(w[0]),.72,pz(w[1])-TS*.25,LVG)});
 E.lamps.forEach((l,i)=>{
  const g=new THREE.Group();g.position.set(px(l[0])+.45,0,pz(l[1])-.45);LVG.add(g);
  cyl(.2,.25,.08,db,g).position.y=.04;cyl(.04,.04,1.2,db,g).position.y=.65;
  const shade=cyl(.2,.34,.34,M(0xfff4d0,.6),g);shade.position.y=1.35;
  const glow=new THREE.Mesh(new THREE.CircleGeometry(1.1,24),new THREE.MeshBasicMaterial({color:0xffe08a,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false}));
  glow.rotation.x=-Math.PI/2;glow.position.set(px(l[0]),.1,pz(l[1]));LVG.add(glow);

  $('#cimg').src=c.toDataURL('image/png');$('#cert').style.display='block';
 };
 if(document.fonts&&document.fonts.ready)document.fonts.ready.then(draw);else draw();
}
$('#cpr').onclick=()=>{const w=window.open('','_blank');if(!w)return;w.document.write('<!doctype html><title>Certificado</title><style>@page{size:A4 landscape;margin:0}html,body{margin:0}img{width:100%;display:block}</style><img src="'+$('#cimg').src+'">');w.document.close();setTimeout(()=>{try{w.focus();w.print()}catch(e){}},400)};
$('#cx').onclick=()=>$('#cert').style.display='none';
$('#cdl').onclick=()=>{const a=document.createElement('a');a.href=$('#cimg').src;a.download='certificado-fabrica.png';a.click()};
/* ---------- blocos ---------- */
function toPy(){
 let ind=0,o=[],prevOpen=false;
 for(const b of prog){
  if(b.k==='else'){ind=Math.max(0,ind-1);o.push('    '.repeat(ind)+'else:');ind++;prevOpen=true;continue}
  if(b.k==='end'){if(prevOpen)o.push('    '.repeat(ind)+'pass');ind=Math.max(0,ind-1);prevOpen=false;continue}
  const sp='    '.repeat(ind);
  if(b.k==='rep'){o.push(sp+'for i in range('+b.n+'):');ind++;prevOpen=true;continue}
  o.push(sp+PY[b.k]);
  if(OPEN.includes(b.k)){ind++;prevOpen=true}else prevOpen=false;
 }
 return o.join('\n')||'# o teu programa aparece aqui';
}
function parsePy(t){
 const out=[];let depth=0;
 const ok=(b,l)=>{if(!CY[cy].b.includes(b.k))throw new Error('Neste ciclo ainda não podes usar: '+l);out.push(b)};
 const simple={'andar()':'F','virar_esquerda()':'L','virar_direita()':'R','luz()':'luz','abrir_porta()':'porta'};
 for(const raw of t.split('\n')){
  const l=raw.trim();if(!l||l[0]==='#')continue;
  const ind=Math.floor((raw.length-raw.trimStart().length)/4);
  if(l==='else:'){
   while(depth>ind+1){out.push({k:'end'});depth--}
   if(depth<1||ind!==depth-1)throw new Error('O «else:» tem de ficar ao nível do «if»');
   ok({k:'else'},l);continue;
  }
  while(depth>ind){out.push({k:'end'});depth--}
  if(l==='pass')continue;
  if(ind>depth)throw new Error('Indentação errada (usa 4 espaços dentro do bloco): '+l);
  let m;
  if(m=l.match(/^for\s+\w+\s+in\s+range\((\d+)\):$/)){const n=+m[1];if(n<1||n>5)throw new Error('range deve ir de 1 a 5');ok({k:'rep',n},l);depth++}
  else if(l==='while caminho_livre():'){ok({k:'wh'},l);depth++}
  else if(l==='if luz_apagada():'){ok({k:'ifO'},l);depth++}
  else if(simple[l])ok({k:simple[l]},l);
  else throw new Error('Não percebi esta linha: '+l);
 }
 while(depth>0){out.push({k:'end'});depth--}
 return out;
}
let sel=-1;
function clear(){prog=(LV[lv]&&LV[lv].pre)?JSON.parse(JSON.stringify(LV[lv].pre)):[];sel=-1}
function render(){
 let ind=0;const h=[];
 prog.forEach((b,i)=>{
  if(b.k==='end'||b.k==='else')ind=Math.max(0,ind-1);
  let inner;
  if(b.k==='end')inner='↩ fim';
  else if(b.k==='rep')inner=NAME.rep+' <b data-n="'+i+'">'+b.n+'×</b> <b data-x="'+i+'">✕</b>';
  else inner=NAME[b.k]+' <b data-x="'+i+'">✕</b>';
  h.push('<span class="chip'+(i===sel?' sel':'')+'" style="background:'+COL[b.k]+';margin-left:'+ind*22+'px" data-i="'+i+'">'+inner+'</span>');
  if(OPEN.includes(b.k)||b.k==='else')ind++;
 });
 $('#prog').innerHTML=h.join('')||'<span style="opacity:.6">Toca nos blocos acima. Toca num bloco do programa para escolher onde juntar o próximo.</span>';
 const t=$('#py');if(document.activeElement!==t)t.value=toPy();
}
function delBlock(i){VB.delRange(prog,i,OPEN).sort((a,b)=>b-a).forEach(j=>prog.splice(j,1));sel=-1;render()}
let running=false,cy=0,LV=CY[0].lv,lv=0;
document.querySelector('.pal').onclick=e=>{
 const a=e.target.closest('button');if(!a||running)return;
 const k=a.dataset.a,items=k==='rep'?[{k:'rep',n:2},{k:'end'}]:OPEN.includes(k)?[{k},{k:'end'}]:[{k}];
 const at=sel>=0?sel+1:prog.length;prog.splice(at,0,...items);sel=at;render();beep(600,.06);
};
$('#prog').onclick=e=>{
 if(running)return;const t=e.target;
 if(t.dataset.x!==undefined){delBlock(+t.dataset.x);return}
 if(t.dataset.n!==undefined){const b=prog[+t.dataset.n];b.n=b.n>=5?2:b.n+1;render();return}
 const c=t.closest('.chip');if(c){const i=+c.dataset.i;sel=sel===i?-1:i;render()}
};
$('#clr').onclick=()=>{if(running)return;clear();render();preview();say('Tudo limpo! Começa de novo. 🙂')};
$('#pyb').onclick=()=>{const p=$('#pyw');p.style.display=p.style.display==='block'?'none':'block'};
$('#pya').onclick=()=>{
 if(running)return;
 try{prog=parsePy($('#py').value);sel=-1;render();$('#msg').textContent='🐍 Código aplicado aos blocos. Carrega em Executar!'}
 catch(er){$('#msg').textContent='🐍 '+er.message;say('Há um erro no código. Lê a mensagem por baixo.','sad')}
};
/* ---------- missões ---------- */
let P={name:'',d:{}};
try{P=JSON.parse(localStorage.getItem('vbc'))||P}catch(e){}
const save=()=>{try{localStorage.setItem('vbc',JSON.stringify(P))}catch(e){}};
if(!P.name){try{P.name=(localStorage.getItem('vanbertos_student_name_v1')||'').trim().slice(0,40)}catch(e){}}
$('#nm').value=P.name||'';$('#nm').oninput=e=>{P.name=e.target.value.trim().slice(0,40);save()};
$('#sp').onchange=e=>{SPD=+e.target.value};
function preview(){const L=LV[lv],E=mk(L,(L.tests||[{}])[0]);window.__E=E;show(E)}
function levels(){
 $('#cys').innerHTML=CY.map((c,i)=>'<button class="lvb'+(i===cy?' on':'')+'" data-c="'+i+'">'+c.n+'</button>').join('');
 $('#lvs').innerHTML=LV.map((_,i)=>{const s=P.d[cy+'-'+i];return '<button class="lvb'+(i===lv?' on':'')+'" data-l="'+i+'">Missão '+(i+1)+(s?' '+'⭐'.repeat(s):'')+'</button>'}).join('');
 $('#mis').textContent=LV[lv].t+(LV[lv].max?' (máx. '+LV[lv].max+' blocos, sem contar o «fim»)':'');
 document.querySelectorAll('.pal button').forEach(b=>b.style.display=CY[cy].b.includes(b.dataset.a)?'':'none');
 $('#pyb').style.display=CY[cy].py?'':'none';
 if(!CY[cy].py)$('#pyw').style.display='none';
}
$('#cys').onclick=e=>{const b=e.target.closest('button');if(!b||running)return;cy=+b.dataset.c;LV=CY[cy].lv;lv=0;clear();levels();render();preview();$('#msg').textContent='';if(CY[cy].py===2)$('#pyw').style.display='block';say(LV[lv].t)};
$('#lvs').onclick=e=>{const b=e.target.closest('button');if(!b||running)return;lv=+b.dataset.l;clear();levels();render();preview();$('#msg').textContent='';say(LV[lv].t)};
$('#go').onclick=async()=>{
 if(running)return;
 const L=LV[lv],tests=L.tests||[{}],E0=mk(L,tests[Math.floor(Math.random()*tests.length)]),r0=simulate(E0),acts=r0.out;
 if(!acts.length){say('Junta primeiro alguns blocos! 🙂');return}
 running=true;$('#msg').textContent='';window.__E=E0;show(E0);
 const off=()=>document.querySelectorAll('.chip.run').forEach(c=>c.classList.remove('run'));
 for(let i=0;i<acts.length;i++){
  off();const c=document.querySelector('.chip[data-i="'+acts[i].i+'"]');if(c)c.classList.add('run');if(document.getElementById('stp')&&document.getElementById('stp').checked)await VB.step();
  $('#msg').textContent='Passo '+(i+1)+' de '+acts.length;await play(acts[i]);
 }
 off();running=false;
 const cnt=prog.filter(b=>b.k!=='end').length;
 const allOk=tests.every(t=>{const E=mk(L,t),r=simulate(E);return !r.st.stop&&won(E,r.st)});
 const shownOk=!r0.st.stop&&won(E0,r0.st),ok=allOk&&(!L.max||cnt<=L.max);
 if(ok){
  const o=OPT[cy][lv],st=cnt<=o?3:cnt<=o+2?2:1,key_=cy+'-'+lv;
  if((P.d[key_]||0)<st)P.d[key_]=st;save();levels();
  const all=LV.every((_,i)=>P.d[cy+'-'+i]);
  $('#msg').innerHTML='✅ Missão cumprida! '+'⭐'.repeat(st)+(st<3?' (com menos blocos ganhas mais estrelas)':'')+(lv<LV.length-1?' <button id="nx" style="background:#7c3aed">Próxima missão ▶</button>':' Terminaste as missões deste ciclo! 🏆')+(all?' <button id="ce" style="background:#e5a000">🎓 Certificado</button>':'');
  say('Boa! O cão chegou à tigela! 🎉');dance();hop(500);
  beep(523,.12);beep(659,.12,'square',.12);beep(784,.25,'square',.24);
  const n=$('#nx');if(n)n.onclick=()=>{lv++;clear();levels();render();preview();$('#msg').textContent='';say(LV[lv].t)};
  const ce=$('#ce');if(ce)ce.onclick=certificate;
 }else{
  $('#msg').textContent=r0.st.stop?(r0.st.err==='luz'?'💡 Aqui não há nenhum candeeiro! Só podes carregar em 💡 quando o cão está em cima de um candeeiro.':r0.st.err==='porta'?'🚪 Aqui não há nenhum botão! Só abres a porta quando o cão está em cima do botão vermelho.':'💥 O cão bateu num obstáculo!'):shownOk?(allOk?'❌ O resultado está certo, mas usaste blocos a mais. Tenta com menos!':'❌ Funciona nesta casa, mas não em todas! O programa tem de servir para qualquer casa.'):'❌ O cão ainda não chegou à tigela com tudo feito. Lê outra vez a missão.';
  say('Quase! Confere os passos do cão.','sad');beep(200,.3,'sawtooth');
 }
};
levels();render();preview();

</script>
