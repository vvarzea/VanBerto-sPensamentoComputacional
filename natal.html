<!DOCTYPE html>
<html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff8e7"><title>Hora do Código · Fábrica do Pai Natal</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1e1b4b;--cream:#fff8e7;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;padding:10px 10px 40px;touch-action:manipulation}
.w{max-width:920px;margin:0 auto}
header,.card{background:#fff;border:3px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink);padding:12px;margin-bottom:16px}
h1{font-family:'Fredoka',sans-serif;font-size:1.4rem;margin:0}.sub{font-weight:800;opacity:.65;font-size:.9rem}
button{font:800 .95rem 'Nunito',sans-serif;cursor:pointer;border:2.5px solid var(--ink);border-radius:14px;box-shadow:0 3px 0 var(--ink);padding:8px 12px;color:var(--ink);background:#fff}
button:active{transform:translateY(3px);box-shadow:none}
button[style*=background],#go,#clr,#pyb{color:#fff}
#go{background:#16a34a}#clr{background:#6b7280}#pyb{background:#3776ab}
.lv,.pal,.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.lvb.on{background:#ffd23f}
#stage{background:linear-gradient(#10224a,#1b3a6b);border:2.5px solid var(--ink);border-radius:14px;padding:10px;color:#fff;position:relative;overflow:hidden}
.row label{font:800 .9rem 'Nunito',system-ui,sans-serif;display:flex;align-items:center;gap:5px}select{font:800 .9rem 'Nunito',sans-serif;border:2.5px solid var(--ink);border-radius:10px;padding:4px 6px}
#c3d{height:clamp(260px,46vw,420px);border-radius:12px;overflow:hidden;margin-bottom:6px}#c3d canvas{display:block}
#st{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center;font-weight:800;font-size:.8rem}
#st div{background:rgba(255,255,255,.1);border-radius:12px;padding:8px 2px;border:2px solid transparent}
#st div.on{border-color:#ffd23f;background:rgba(255,210,63,.25)}#st i{display:block;font-size:1.8rem;font-style:normal}
#belt{height:70px;position:relative;margin-top:8px;background:repeating-linear-gradient(90deg,#333 0 14px,#444 14px 28px);border-radius:10px}
#toy{position:absolute;top:6px;left:0;width:20%;text-align:center;font-size:2.2rem;transition:left .45s ease;line-height:1.2}
#toy span{display:inline-block;padding:0 8px;border-radius:10px}
#info{margin-top:8px;font-weight:800;font-size:.9rem;display:flex;gap:14px;flex-wrap:wrap}
#mis{font-weight:800;margin:6px 0}
#prog{min-height:60px;display:flex;flex-direction:column;gap:4px;align-items:flex-start;margin-bottom:8px}
.chip{color:#fff;font-weight:800;padding:5px 10px;border-radius:10px;cursor:pointer;border:2px solid transparent}
.chip.sel{border-color:#000}.chip.run{outline:3px solid #ffd23f}
#msg{font-weight:800;margin-top:8px}
#pyw{display:none}#py{width:100%;font:600 .9rem ui-monospace,monospace;border:2px solid var(--ink);border-radius:10px;padding:8px}
footer{text-align:center;opacity:.6;font-weight:800}
</style></head><body><div class="w">
<header><h1>🎅 Hora do Código · Fábrica do Pai Natal</h1><div class="sub">VanBerto’s · Programa com blocos e Python</div></header>
<div class="card"><div id="stage"><div id="c3d"></div><div id="st" class="fb"><div><i>🔨</i>Oficina</div><div><i>🎁</i>Embrulho</div><div><i>🎀</i>Laços</div><div><i>✉️</i>Cartões</div><div><i>🛷</i>Trenó</div></div>
<div id="belt" class="fb"><div id="toy"></div></div><div id="info"><span>🎄 Prendas no trenó: <b id="hd">0</b></span><span id="ped"></span></div></div>
<div class="row" style="margin-top:8px"><label>👤 <input id="nm" maxlength="14" placeholder="O teu nome" style="font:800 .9rem Nunito,sans-serif;border:2.5px solid #1e1b4b;border-radius:12px;padding:6px 10px;width:150px"></label><label>⏱ <select id="sp"><option value="0.6">Devagar</option><option value="1" selected>Normal</option><option value="2">Rápido</option></select></label><label><input type="checkbox" id="stp"> 🐢 Passo a passo</label><label><input type="checkbox" id="snd" checked> 🔊 Som</label><label><input type="checkbox" id="lgt"> ⚡ Modo leve</label></div></div>
<div class="card"><div class="lv" id="cys"></div><div class="lv" id="lvs"></div><div id="mis"></div>
<div class="pal">
<button style="background:#b45309" data-a="F">🔨 fazer brinquedo</button>
<button style="background:#e5484d" data-a="R">🎁 papel vermelho</button>
<button style="background:#3e63dd" data-a="B">🎁 papel azul</button>
<button style="background:#4c9a2a" data-a="G">🎁 papel verde</button>
<button style="background:#d946a8" data-a="L">🎀 pôr laço</button>
<button style="background:#0e7490" data-a="C">✉️ pôr cartão</button>

<button style="background:#2b8a9e" data-a="ifB">🔀 se pedido azul</button>

<footer>© Prof.ª Vanda Várzea</footer></div>
<script src="three.min.js"></script>
<script src="vb-core.js"></script>
<script>
const $=s=>document.querySelector(s);
const NAME={F:'🔨 fazer brinquedo',R:'🎁 papel vermelho',B:'🎁 papel azul',G:'🎁 papel verde',L:'🎀 pôr laço',C:'✉️ pôr cartão',E:'🛷 pôr no trenó',rep:'🔁 repetir',wh:'🔄 enquanto faltar fazer',ifB:'🔀 se pedido azul',ifR:'🔀 se pedido vermelho',else:'↔ senão'};
const COL={F:'#b45309',R:'#e5484d',B:'#3e63dd',G:'#4c9a2a',L:'#d946a8',C:'#0e7490',E:'#30a46c',rep:'#8e4ec6',wh:'#c2410c',ifB:'#2b8a9e',ifR:'#2b8a9e',else:'#4aa8bb',end:'#a98bd8'};
const PY={F:'fazer_brinquedo()',R:'embrulhar("vermelho")',B:'embrulhar("azul")',G:'embrulhar("verde")',L:'por_laco()',C:'por_cartao()',E:'por_no_trenó()',ifB:'if pedido == "azul":',ifR:'if pedido == "vermelho":',wh:'while faltam_brinquedos():'};
const STN={F:0,R:1,B:1,G:1,L:2,C:3,E:4},PAPER={R:'#e5484d',B:'#3e63dd',G:'#4c9a2a'};
const x=(n,k)=>Array(n).fill(k);
const B1=['F','R','B','G','L','C','E'],B2=[...B1,'rep'],B4=[...B2,'ifB','ifR','else','wh'];
const CY=[
{n:'1.º Ciclo',b:B1,py:0,lv:[
 {t:'Faz um brinquedo e põe-no no trenó.',g:['F','E']},
 {t:'Faz um brinquedo, embrulha-o em papel vermelho e põe-no no trenó.',g:['F','R','E']},
 {t:'Faz um brinquedo, embrulha em papel verde, põe o laço e coloca no trenó.',g:['F','G','L','E']},
 {t:'Faz um brinquedo, embrulha na cor que quiseres, põe laço e cartão e coloca no trenó.',g:['F','P','L','C','E'],free:true}]},
{n:'2.º Ciclo',b:B2,py:0,lv:[
 {t:'Faz 3 brinquedos, embrulha em vermelho e põe no trenó. Dica: usa o repetir!',g:[...x(3,'F'),'R','E']},
 {t:'Faz 4 brinquedos, embrulha em azul, põe o laço e coloca no trenó.',g:[...x(4,'F'),'B','L','E']},
 {t:'Faz 2 brinquedos, embrulha em vermelho, faz mais 2, põe o laço e coloca no trenó.',g:['F','F','R','F','F','L','E']},
 {t:'Faz 5 brinquedos, embrulha em verde, põe o cartão e coloca no trenó.',g:[...x(5,'F'),'G','C','E']},
 {t:'🐞 Encontra o erro! Era para fazer 3 brinquedos, embrulhar em vermelho e pôr no trenó, mas o programa tem um erro. Corrige-o!',pre:[{k:'rep',n:3},{k:'F'},{k:'end'},{k:'G'},{k:'E'}],g:[...x(3,'F'),'R','E']}]},
{n:'3.º Ciclo',b:B2,py:1,lv:[
 {t:'Repete 3 vezes: fazer e embrulhar em vermelho. Depois põe o laço e coloca no trenó.',g:['F','R','F','R','F','R','L','E']},
 {t:'Faz 3 brinquedos, embrulha em verde, põe o laço e o cartão e coloca no trenó.',g:[...x(3,'F'),'G','L','C','E']},
 {t:'Repete 2 vezes: fazer 2 brinquedos e embrulhar em azul. Depois laço e trenó.',g:['F','F','B','F','F','B','L','E']}]},
{n:'Secundário',b:B4,py:2,lv:[
 {t:'Cada pedido chega com um número diferente de brinquedos por fazer. Usa «enquanto» para os fazer todos, embrulha em vermelho, põe o laço e coloca no trenó.',max:5,tests:[{pecas:2},{pecas:3},{pecas:5}],x:e=>[...x(e.pecas,'F'),'R','L','E']},
 {t:'O pedido pode ser azul ou vermelho. Faz 1 brinquedo, embrulha na cor do pedido (usa «se» e «senão»), põe laço e cartão e coloca no trenó.',max:9,tests:[{cor:'B'},{cor:'R'}],x:e=>['F',e.cor,'L','C','E']},
 {t:'Pedido completo! Faz todos os brinquedos que faltam, embrulha na cor do pedido, põe o laço e coloca no trenó.',max:9,tests:[{pecas:1,cor:'B'},{pecas:3,cor:'R'},{pecas:4,cor:'B'}],x:e=>[...x(e.pecas,'F'),e.cor,'L','E']}]}
];
const OPT=[[2,3,4,5],[4,5,7,5,4],[5,6,6],[5,8,8]];
let T3=null;let AC=null;const FAILS={};let cy=0,LV=CY[0].lv,lv=0,prog=[],sel=-1,SPD=1,running=false,P={d:{}};
try{P=JSON.parse(localStorage.getItem('vbn'))||P}catch(e){}
const save=()=>{try{localStorage.setItem('vbn',JSON.stringify(P))}catch(e){}};
const OPEN=['rep','wh','ifB','ifR'];
function build(){return VB.build(prog,OPEN)}
function run(nodes,env,out){for(const nd of nodes){if(out.length>60)return;const k=nd.t.k;
 if(k==='rep'){for(let j=0;j<nd.t.n;j++)run(nd.b,env,out)}
 else if(k==='wh'){let c=0;while(env&&env.pecas>0&&c++<20)run(nd.b,env,out)}
 else if(k==='ifB'||k==='ifR'){run(env&&env.cor===(k==='ifB'?'B':'R')?nd.b:(nd.e||[]),env,out)}
 else{out.push({k,i:nd.i});if(k==='F'&&env&&env.pecas>0)env.pecas--}}}
function expand(env){const out=[];run(build(),env,out);return out}
function toPy(){let ind=0,o=[],po=false;
 for(const b of prog){
  if(b.k==='else'){ind=Math.max(0,ind-1);o.push('    '.repeat(ind)+'else:');ind++;po=true;continue}
  if(b.k==='end'){if(po)o.push('    '.repeat(ind)+'pass');ind=Math.max(0,ind-1);po=false;continue}
  const sp='    '.repeat(ind);
  if(b.k==='rep'){o.push(sp+'for i in range('+b.n+'):');ind++;po=true;continue}
  if(OPEN.includes(b.k)){o.push(sp+PY[b.k]);ind++;po=true;continue}
  o.push(sp+PY[b.k]);po=false}
 return o.join('\n')||'# o teu programa aparece aqui'}
function render(){let ind=0;const h=[];
 prog.forEach((b,i)=>{if(b.k==='end'||b.k==='else')ind=Math.max(0,ind-1);
  let inner=b.k==='end'?'↩ fim':b.k==='rep'?NAME.rep+' <b data-n="'+i+'">'+b.n+'×</b> <b data-x="'+i+'">✕</b>':NAME[b.k]+' <b data-x="'+i+'">✕</b>';
  h.push('<span class="chip'+(i===sel?' sel':'')+'" style="background:'+COL[b.k]+';margin-left:'+ind*22+'px" data-i="'+i+'">'+inner+'</span>');
  if(OPEN.includes(b.k)||b.k==='else')ind++});
 $('#prog').innerHTML=h.join('')||'<span style="opacity:.6">Toca nos blocos acima. Toca num bloco do programa para escolher onde juntar o próximo.</span>';
 $('#py').value=toPy()}
function delBlock(i){VB.delRange(prog,i,OPEN).sort((a,b)=>b-a).forEach(j=>prog.splice(j,1));sel=-1;render()}
function clear(){prog=(LV[lv]&&LV[lv].pre)?JSON.parse(JSON.stringify(LV[lv].pre)):[];sel=-1}
function levels(){
 $('#cys').innerHTML=CY.map((c,i)=>'<button class="lvb'+(i===cy?' on':'')+'" data-c="'+i+'">'+c.n+'</button>').join('');
 $('#lvs').innerHTML=LV.map((_,i)=>{const s=P.d[cy+'-'+i];return '<button class="lvb'+(i===lv?' on':'')+'" data-l="'+i+'">Missão '+(i+1)+(s?' '+'⭐'.repeat(s):'')+'</button>'}).join('');
 $('#mis').textContent=LV[lv].t+(LV[lv].max?' (máx. '+LV[lv].max+' blocos, sem contar o «fim»)':'');
 document.querySelectorAll('.pal button').forEach(b=>b.style.display=CY[cy].b.includes(b.dataset.a)?'':'none');
 $('#pyb').style.display=CY[cy].py?'':'none';if(!CY[cy].py)$('#pyw').style.display='none'}
/* ---- animação ---- */
const sleep=ms=>new Promise(r=>setTimeout(r,ms/SPD));
let state,done=0;
function showToy(){if(T3)T3.sync();const t=$('#toy');if(!state.made){t.innerHTML='';return}
 t.innerHTML='<span style="background:'+(state.paper?PAPER[state.paper]:'transparent')+'">🧸</span>'+(state.ribbon?'🎀':'')+(state.card?'✉️':'')}
function showEnv(e){$('#ped').textContent=e?(e.cor?'📋 Pedido '+(e.cor==='B'?'azul':'vermelho')+' ':'')+(e.pecas!=null?'🔩 Por fazer: '+e.pecas:''):''}
function reset(e){done=0;$('#hd').textContent=0;if(T3)T3.clear();state={made:0,paper:null,ribbon:false,card:false};showToy();$('#toy').style.left='0';document.querySelectorAll('#st div').forEach(d=>d.classList.remove('on'));showEnv(e||null)}
async function act(k,env){
 const s=STN[k];document.querySelectorAll('#st div').forEach((d,i)=>d.classList.toggle('on',i===s));
 $('#toy').style.left=s*20+'%';if(T3)T3.go(s);beep(220+s*110,.12);await sleep(500);
 if(k==='F'){if(!state.made&&T3)T3.newToy();state.made=1;if(env&&env.pecas>0){env.pecas--;showEnv(env)}}
 else if('RBG'.includes(k))state.paper=k;
 else if(k==='L')state.ribbon=true;else if(k==='C')state.card=true;
 else if(k==='E'){done++;$('#hd').textContent=done;if(T3)T3.deliver();beep(660,.2);state={made:0,paper:null,ribbon:false,card:false}}
 showToy();await sleep(300);if(T3)T3.idle()}
/* ---- eventos ---- */
document.querySelector('.pal').onclick=e=>{const a=e.target.closest('button');if(!a||running)return;
 const k=a.dataset.a,items=k==='rep'?[{k:'rep',n:2},{k:'end'}]:OPEN.includes(k)?[{k},{k:'end'}]:[{k}];
 const at=sel>=0?sel+1:prog.length;prog.splice(at,0,...items);sel=at;render()};
$('#prog').onclick=e=>{if(running)return;const t=e.target;
 if(t.dataset.x!==undefined){delBlock(+t.dataset.x);return}
 if(t.dataset.n!==undefined){const b=prog[+t.dataset.n];b.n=b.n>=5?2:b.n+1;render();return}
 const c=t.closest('.chip');if(c){const i=+c.dataset.i;sel=sel===i?-1:i;render()}};
$('#cys').onclick=e=>{const b=e.target.closest('button');if(!b||running)return;cy=+b.dataset.c;LV=CY[cy].lv;lv=0;clear();levels();render();reset();$('#msg').textContent=''};
$('#lvs').onclick=e=>{const b=e.target.closest('button');if(!b||running)return;lv=+b.dataset.l;clear();levels();render();reset();$('#msg').textContent=''};
$('#clr').onclick=()=>{if(running)return;clear();render();reset();$('#msg').textContent=''};
$('#pyb').onclick=()=>{const p=$('#pyw');p.style.display=p.style.display==='block'?'none':'block'};
$('#sp').onchange=e=>SPD=+e.target.value;
$('#go').onclick=async()=>{
 if(running)return;
 const L=LV[lv],tests=L.tests||[null],e0=tests[Math.floor(Math.random()*tests.length)],acts=expand(e0?{...e0}:null);
 if(!acts.length){$('#msg').textContent='Junta primeiro alguns blocos! 🙂';return}
 if(acts.length>40){$('#msg').textContent='Programa muito grande! Usa o repetir com menos vezes.';return}
 running=true;$('#msg').textContent='';const env=e0?{...e0}:null;reset(env);
 const off=()=>document.querySelectorAll('.chip.run').forEach(c=>c.classList.remove('run'));
 for(let i=0;i<acts.length;i++){off();const c=document.querySelector('.chip[data-i="'+acts[i].i+'"]');if(c)c.classList.add('run');if(document.getElementById('stp')&&document.getElementById('stp').checked)await VB.step();
  $('#msg').textContent='Passo '+(i+1)+' de '+acts.length;await act(acts[i].k,env)}
 off();running=false;
 const cnt=prog.filter(b=>b.k!=='end').length,nz=a=>L.free?a.map(k=>'RBG'.includes(k)?'P':k):a,
  seq=e=>nz(expand(e?{...e}:null).map(a=>a.k)),goal=e=>nz(L.x?L.x(e):L.g),
  shownOk=seq(e0).join()===goal(e0).join(),okSeq=tests.every(e=>seq(e).join()===goal(e).join()),ok=okSeq&&(!L.max||cnt<=L.max);
 if(ok){const o=OPT[cy][lv],st=cnt<=o?3:cnt<=o+2?2:1,key=cy+'-'+lv;if((P.d[key]||0)<st)P.d[key]=st;FAILS[key]=0;save();levels();fan();
  $('#msg').innerHTML='✅ Missão cumprida'+(P.name?', '+P.name:'')+'! '+'⭐'.repeat(st)+(st<3?' (com menos blocos ganhas mais estrelas)':'')+(lv<LV.length-1?' <button id="nx" style="background:#2f6bff">Próxima missão ▶</button>':' Terminaste as missões deste ciclo! 🏆');
  const n=$('#nx');if(n)n.onclick=()=>{lv++;clear();levels();render();reset();$('#msg').textContent=''}}
 else{let m;
  if(okSeq)m='❌ O resultado está certo, mas usaste blocos a mais. Tenta com menos!';
  else if(shownOk)m='❌ Funciona neste pedido, mas não em todos! O programa tem de servir para qualquer pedido.';
  else{const fk=cy+'-'+lv;FAILS[fk]=(FAILS[fk]||0)+1;m=VB.hint(FAILS[fk],seq(e0),goal(e0),k=>k==='P'?'🎁 embrulhar (uma cor)':NAME[k])}
  $('#msg').textContent=m}};
function beep(f,d){if(!$('#snd').checked)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function fan(){if(T3)T3.cheer();[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.18),i*140))}
const nm=$('#nm');try{const o=JSON.parse(localStorage.getItem('vbf')||localStorage.getItem('vbc')||'{}');nm.value=P.name||o.name||''}catch(e){}
nm.oninput=()=>{P.name=nm.value.trim();save()};
const IMG={treno:'natal-treno.png',robo:'natal-robo.png'};
/* ---- cena 3D (se o WebGL falhar, fica o palco 2D de emojis) ---- */
(function(){
 const box=$('#c3d'),lgt=$('#lgt');let R;
 try{if(!window.THREE)throw 0;const c=document.createElement('canvas');if(!(c.getContext('webgl')||c.getContext('experimental-webgl')))throw 0;R=new THREE.WebGLRenderer({antialias:true})}catch(e){box.style.display='none';return}
 document.querySelectorAll('.fb').forEach(e=>e.style.display='none');
 try{lgt.checked=!!localStorage.getItem('vbn_leve')}catch(e){}
 const sc=new THREE.Scene();sc.background=new THREE.Color(0x10224a);sc.fog=new THREE.Fog(0x10224a,24,50);
 const cam=new THREE.PerspectiveCamera(42,2,.1,100);cam.position.set(0,8.5,14.5);cam.lookAt(0,.6,0);
 sc.add(new THREE.AmbientLight(0xffffff,.7));const dl=new THREE.DirectionalLight(0xffffff,.9);dl.position.set(6,12,8);sc.add(dl);
 const M=c=>new THREE.MeshLambertMaterial({color:c}),BG=THREE.BoxGeometry;
 const add=(g,m,x,y,z,p)=>{const o=new THREE.Mesh(g,m);o.position.set(x,y,z);(p||sc).add(o);return o};
 add(new BG(36,.4,12),M(0xeaf4ff),0,-.45,-1);add(new BG(27,.3,2.4),M(0x333844),0,-.1,0);
 for(let i=-12;i<=12;i+=1.5)add(new BG(.5,.05,2.4),M(0x4a5060),i,.07,0);
 const XS=[-9,-4.5,0,4.5,9],EM=['🔨','🎁','🎀','✉️','🛷'],TX=['Oficina','Embrulho','Laços','Cartões','Trenó'],CO=[0xb45309,0xe5484d,0xd946a8,0x0e7490,0xc0392b],arms=[];
